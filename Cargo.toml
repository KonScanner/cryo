
[workspace]
members  = ["crates/cli", "crates/freeze", "crates/to_df"]
# crates/python is intentionally NOT a workspace member: it depends on
# pyo3-polars which enables `polars-error/python`, propagating pyo3 with the
# `extension-module` feature into every workspace crate via Cargo's feature
# unification — which then fails to link the standalone `cryo` binary.
# It is a standalone crate (see crates/python/Cargo.toml) and is built
# separately via the `python-wheel` Makefile target.
exclude  = ["crates/python"]

# Resolver 3 (Cargo 1.84+) gives per-target feature resolution, which we need
# so pyo3's `extension-module` feature (enabled only by crates/python) does
# not propagate via workspace unification into the standalone `cryo` binary,
# where it causes link errors for PyErr_* symbols.
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/paradigmxyz/cryo"
repository = "https://github.com/paradigmxyz/cryo"
exclude = [".github/"]

[workspace.dependencies]
cryo_cli = { version = "0.4.0", path = "./crates/cli" }
cryo_freeze = { version = "0.4.0", path = "./crates/freeze" }
cryo_to_df = { version = "0.4.0", path = "./crates/to_df" }

alloy = { version = "2.0.5", features = [
    "full",
    "rpc-types-trace",
    "provider-ws",
    "provider-ipc",
    "provider-debug-api",
    "provider-trace-api",
    "transport-ipc-mock",
] }
anstyle = "1.0.4"
chrono = { version = "0.4.31", features = ["serde"] }
clap_cryo = { version = "4.3.21-cryo", features = [
    "derive",
    "color",
    "unstable-styles",
] }
colored = "2.0.4"
color-print = "0.3.5"
eyre = "0.6.8"
futures = "0.3.29"
governor = "0.6.0"
hex = "0.4.3"
heck = "0.4.1"
indexmap = "2.1.0"
indicatif = "0.17.7"
lazy_static = "1.4.0"
mesc = "0.1.4"
polars = { version = "0.53", features = [
    "parquet",
    "string_encoding",
    "lazy",
    "binary_encoding",
    "json",
    "dtype-struct",
] }
# polars-io 0.53 stopped re-exporting GzipLevel/BrotliLevel/ZstdLevel; we
# import them directly from polars-parquet to preserve user-controlled
# compression levels in the CLI.
polars-parquet = "0.53"
prefix-hex = "0.7.1"
# NB: `extension-module` is set per-crate in crates/python/Cargo.toml only.
# Enabling it workspace-wide propagates via Cargo's feature unification and
# breaks the standalone `cryo` binary (link errors for PyErr_* symbols).
pyo3 = "0.27"
pyo3-build-config = "0.27"
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
pyo3-polars = "0.26"
rand = "0.8.5"
regex = "1.10.2"
serde = { version = "1.0.191", features = ["derive"] }
serde_json = "1.0.108"
thiserror = "1.0.50"
thousands = "0.2.0"
tokio = { version = "1.33.0", features = ["macros", "rt-multi-thread", "sync"] }

[profile.dev]
incremental = true
debug = 1
codegen-units = 32
