# Pinned toolchain for the triodion-py extension crate.
#
# Read by rustup (and by cargo via rustup's proxy): every cargo invocation
# from this directory or below auto-installs and uses this toolchain.
# Result: local devs, CI, and the Dockerfile builder all compile against
# the same rustc/cargo, removing "works on my machine" drift.
#
# Why 1.95.0:
#   - Several transitive deps in the workspace Cargo.lock have bumped their
#     MSRV beyond triodion's nominal 1.85: ruint 1.18 needs 1.90, nybbles 0.4.8
#     / serde_with 3.20 / simd-json 0.17 need 1.88. A 1.85.0 pin no longer
#     compiles the workspace. 1.95.0 is the current stable as of May 2026
#     and satisfies every dep's MSRV.
#   - Cargo 1.84+ resolver = "3" is required by the parent triodion workspace
#     (the workspace Cargo.toml); 1.95.0 satisfies that.
#   - Match the Dockerfile's RUST_VERSION pin. When bumping either, bump
#     both — Docker builds and local builds must stay in lockstep.
#
# profile = "minimal" keeps the auto-install small (~150MB vs ~1GB for full
# stable). rustfmt + clippy are needed by the make targets (format-check,
# lint), so we ask for them explicitly.
[toolchain]
channel    = "1.95.0"
profile    = "minimal"
components = ["rustfmt", "clippy"]
