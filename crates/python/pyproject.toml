[build-system]
requires = ["maturin>=1.1,<2.0"]
build-backend = "maturin"

[project]
# Distribution name and import path are both `triodion`, matching the Rust
# crates. This is a BREAKING change from `cryo-konscanner` / `import cryo`:
# consumers must update both the dependency name and their import statements.
name = "triodion"
# Version is pulled from Cargo.toml by maturin. PEP 621 requires either
# `version` or `dynamic = ["version"]`; the latter keeps the source of truth
# in one place (Cargo.toml).
dynamic = ["version"]
description = "triodion (KonScanner fork of cryo) — blockchain data extractor with extensions."
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
readme = "README.md"


[tool.maturin]
python-source = "python"
module-name = "triodion._triodion_rust"
features = ["pyo3/extension-module"]


[tool.mypy]
strict = true
files = ["python/triodion"]
enable_incomplete_feature = "Unpack"

