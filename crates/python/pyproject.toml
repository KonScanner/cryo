[build-system]
requires = ["maturin>=1.1,<2.0"]
build-backend = "maturin"

[project]
# Distribution name diverges from upstream paradigmxyz/cryo on purpose: this
# fork's wheel is published as `cryo-konscanner` so it cannot be confused
# with — nor silently substituted for — the upstream PyPI release.
# Pip resolving plain `cryo` against PyPI will hit upstream; consumers of
# this fork must depend on `cryo-konscanner` explicitly.
#
# The PYTHON IMPORT PATH is unchanged: `import cryo` still works because
# the Python package directory is `python/cryo/` (see [tool.maturin]
# python-source below) and the native module is `cryo._cryo_rust`. The
# PEP 621 `name` only affects the wheel filename and pip metadata.
name = "cryo-konscanner"
# Version is pulled from Cargo.toml by maturin. PEP 621 requires either
# `version` or `dynamic = ["version"]`; the latter keeps the source of truth
# in one place (Cargo.toml).
dynamic = ["version"]
description = "cryo (KonScanner fork) — blockchain data extractor with extensions."
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
readme = "README.md"


[tool.maturin]
python-source = "python"
module-name = "cryo._cryo_rust"
features = ["pyo3/extension-module"]


[tool.mypy]
strict = true
files = ["python/cryo"]
enable_incomplete_feature = "Unpack"

